[project]
name = "ecommerce-purchase-propensity"
version = "1.0.0"
description = "Scoring de propension et attribution sur les parcours clients web (Google Analytics)."
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
